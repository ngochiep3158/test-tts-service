name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # Khai báo các service cần tự động test tại đây
        service: [api-gateway, auth-service, tts-service] 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install dependencies
      run: npm install
      working-directory: ./services/${{ matrix.service }}
      
    - name: Build
      run: npm run build
      working-directory: ./services/${{ matrix.service }}